
<!DOCTYPE html>
<html>

<head>
    <title>Image Overlay Fade</title>

    <style>
        .container {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            overflow: hidden;
        }

        .container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background-color: #f1e213;
            color: white;

            opacity: 0;
            transition: 0.5s ease;

            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 30px;
            box-sizing: border-box;
        }

        .container:hover .overlay {
            opacity: 1;
        }
    </style>
</head>

<body>

    <h2>Rounded Images</h2>

    <div class="container">

        <!-- 圖片 URL 放這裡 -->
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR5DlKUBe_kjRSdOv_llprqCfjHNZy_phMNBKuafsUyag&s" alt="Avatar">

        <div class="overlay">
            <span>Brad Pitt</span>
        </div>

    </div>

</body>
</html>
